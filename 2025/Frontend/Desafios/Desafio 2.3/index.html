<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculatorContainer">
        <div class="calculatorBody">
            <div id="display1">
                <div id="displayText"></div>
            </div>
            <div class="row">
                <button class="buttonsCalc">7</button>
                <button class="buttonsCalc">8</button>
                <button class="buttonsCalc">9</button>
                <button class="buttonsCalc">*</button>
            </div>
            <div class="row">
                <button class="buttonsCalc">4</button>
                <button class="buttonsCalc">5</button>
                <button class="buttonsCalc">6</button>
                <button class="buttonsCalc">/</button>
            </div>
            <div class="row">
                <button class="buttonsCalc">1</button>
                <button class="buttonsCalc">2</button>
                <button class="buttonsCalc">3</button>
                <button class="buttonsCalc">-</button>
            </div>
            <div class="row">
                <button class="buttonsCalc buttonLeft">C</button>
                <button class="buttonsCalc">0</button>
                <button class="buttonsCalc">=</button>
                <button class="buttonsCalc buttonRight">+</button>
            </div>
        </div>
    </div>
    <script src="scripts2.js"></script>
</body>
</html>
