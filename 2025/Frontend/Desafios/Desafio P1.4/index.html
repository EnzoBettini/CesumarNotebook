<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .margem{
            margin-left: 15%;
            margin-right: 15%;
        }
    </style>
</head>
<body>
    <div class="card margem">
        <div class="card-body">
            <div id="display">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>nome</th>
                            <th>valor unitario</th>
                            <th>editar</th>
                            <th>excluir</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>

        let display=document.getElementById("display");
        let listaProdutos = [
    { id: 1, nome: "Produto 1", valor_unitario: 10.50 },
    { id: 2, nome: "Produto 2", valor_unitario: 15.30 },
    { id: 3, nome: "Produto 3", valor_unitario: 7.99 },
    { id: 4, nome: "Produto 4", valor_unitario: 23.75 },
    { id: 5, nome: "Produto 5", valor_unitario: 19.40 },
    { id: 6, nome: "Produto 6", valor_unitario: 12.90 },
    { id: 7, nome: "Produto 7", valor_unitario: 8.25 },
    { id: 8, nome: "Produto 8", valor_unitario: 5.60 },
    { id: 9, nome: "Produto 9", valor_unitario: 14.99 },
    { id: 10, nome: "Produto 10", valor_unitario: 22.10 },
    { id: 11, nome: "Produto 11", valor_unitario: 18.20 },
    { id: 12, nome: "Produto 12", valor_unitario: 10.00 },
    { id: 13, nome: "Produto 13", valor_unitario: 13.75 },
    { id: 14, nome: "Produto 14", valor_unitario: 9.40 },
    { id: 15, nome: "Produto 15", valor_unitario: 17.90 },
    { id: 16, nome: "Produto 16", valor_unitario: 11.80 },
    { id: 17, nome: "Produto 17", valor_unitario: 6.99 },
    { id: 18, nome: "Produto 18", valor_unitario: 20.00 },
    { id: 19, nome: "Produto 19", valor_unitario: 25.50 },
    { id: 20, nome: "Produto 20", valor_unitario: 30.99 }
];
        mostrarElementos();

        function mostrarElementos(){
            listaProdutos.forEach((produto)=>{
                let htmlNovo=`
                <tr id='idproduto-${produto.id}'>
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>${produto.valor_unitario}</td>
                    <td><a class='btn btn-warning' href='formControl.html'>editar</a</td>
                    <td><button class='btn btn-danger'>excluir</button></td>
                </tr>
                `;
                display.querySelector("tbody").innerHTML+=htmlNovo;
            })
        }
    </script>
</body>
</html>
