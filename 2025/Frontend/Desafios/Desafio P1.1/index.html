<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="card margensTabela fundoTabela">
        <div class="card-body">
            <form>
                <h3 class="text-center">Lista produtos</h3>
                <div class="row mt-3">
                    <div class="col-12 mb-3">
                        <label>Nome produto:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="nomeProduto" id="nomeProduto">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 mb-3">
                        <label>Valor produto:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="valorProduto" id="valorProduto">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 mb-3">
                        <label>Quantidade produto:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="qntProduto" id="qntProduto">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 mb-3">
                        <label>Nome do produto para remover:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="removerProdutoNome" id="removerProdutoNome">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-6 w100 text-center">
                        <button class="btn btn-danger" id="botaoRm"> Remover</button>
                    </div>
                    <div class="col-6 w100 text-center">
                        <button class="btn btn-success" id="botaoAdd">Adicionar</button>
                    </div>
                </div>
            </form>
            <hr>
            <h4 class="text-center">Lista de produtos</h4>
            <div id="display">
                <table class="table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Valor</th>
                            <th>Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
