<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter String para Int</title>
    <script>
        // Pede um número como string
        var numeroString = prompt("Digite um número:");

        // Converte para inteiro
        var numeroInt = parseInt(numeroString);

        // Exibe o resultado
        alert("O número convertido é: " + numeroInt);
    </script>
</head>
<body>
    <h1>Abra o console para ver mais detalhes!</h1>
</body>
</html>
