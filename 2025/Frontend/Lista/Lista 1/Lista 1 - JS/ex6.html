<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booleano no Console</title>
    <script>
        // Criando uma variável booleana
        var estaChovendo = true;

        // Exibindo o valor no console
        console.log("Está chovendo? " + estaChovendo);
    </script>
</head>
<body>
    <h1>Abra o console (F12) para ver o resultado!</h1>
</body>
</html>
