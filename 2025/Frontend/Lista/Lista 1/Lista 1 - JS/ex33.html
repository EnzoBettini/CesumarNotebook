<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div id="divSemCor"> 
        Este é um texto dentro de uma div sem cor de fundo
    </div>
    <button id="aletrarDiv"> clique aqui para alterar a cor do fundo da div</button>

    <script>
        let divSemCor = document.getElementById("divSemCor");
        let botao = document.getElementById("aletrarDiv");

        botao.addEventListener("click", function(){
            divSemCor.style.backgroundColor = "red";
            divSemCor.textContent = "A cor do fundo da div foi alterada para vermelho";
        })

    </script>
</body>
</html>
