<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de Variável</title>
    <script>
        // Criando uma variável
        var exemplo = 42;
        let exemplo2 = "Olá, mundo!";
        const exemplo3 = true;
        let exemplo4 = null;
        let exemplo5 = undefined;
        let exemplo6 = false;

        // Exibindo o tipo da variável no console
        console.log("O tipo da variável é: " + typeof exemplo);

        // Exibindo o tipo da variável com alert
        alert("O tipo da variável é: " + typeof exemplo);
        alert("O tipo da variável é: " + typeof exemplo2);
        alert("O tipo da variável é: " + typeof exemplo3);
        alert("O tipo da variável é: " + typeof exemplo4);
        alert("O tipo da variável é: " + typeof exemplo5);
        alert("O tipo da variável é: " + typeof exemplo6);
    </script>
</head>
<body>
    <h1>Abra o console (F12) para ver o resultado!</h1>
</body>
</html>
