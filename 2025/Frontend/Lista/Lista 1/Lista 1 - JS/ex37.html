<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5HqS1hZcL5psQj3U_GJxWPf7HnNUhc-BnMA&s" alt="Imagem de exemplo" id="imagem">
    <img
  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5HqS1hZcL5psQj3U_GJxWPf7HnNUhc-BnMA&s"
  alt="Imagem de exemplo"
  id="imagem"
  onmouseover="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Placeholder_view_vector.svg/640px-Placeholder_view_vector.svg.png'"
  onmouseout="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5HqS1hZcL5psQj3U_GJxWPf7HnNUhc-BnMA&s'"
>

    <script>
        const imagem = document.getElementById("imagem");

        imagem.addEventListener("mouseover", () => {
        imagem.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHE0KEz-cM4oO0MDkBhgDnFcbgiI4B0bS3MW_43MRX3acz8JI_wWqzjdiSbLypDMfS0kQ&usqp=CAU";
        });

        imagem.addEventListener("mouseout", () => {
        imagem.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5HqS1hZcL5psQj3U_GJxWPf7HnNUhc-BnMA&s";
        });
    </script>
</body>
</html>
