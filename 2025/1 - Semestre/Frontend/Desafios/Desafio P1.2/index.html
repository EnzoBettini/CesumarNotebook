<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Ultimo teste</title>
</head>
<body>
    <div class="card margens mt-5">
        <div class="card-body">
            <form>
                <h3 class="text-center">Lista de produtos</h3>
                <div class="row">
                    <div class="col mt-3">
                        <label>Nome do produto:</label>
                    </div>
                    <div class="col-12 mt-3">
                        <input class="form-control" type="text" name="nomeProduto" id="nomeProduto">
                    </div>
                </div>
                <div class="row">
                    <div class="col mt-3">
                        <label>Valor do produto:</label>
                    </div>
                    <div class="col-12 mt-3">
                        <input class="form-control" type="text" name="valorProduto" id="valorProduto">
                    </div>
                </div>
                <div class="row">
                    <div class="col mt-3">
                        <label>Quantidade do produto:</label>
                    </div>
                    <div class="col-12 mt-3">
                        <input class="form-control" type="text" name="qntProduto" id="qntProduto">
                    </div>
                </div>
                <div class="row mt-3 text-center">
                    <div><button class="btn btn-success col-12 mt-3" id="botaoAdd"> Salvar </button></div>
                </div>
            </form>
            <div class="row">
                <div class="col mt-3">
                    <label>Remover qual produto?</label>
                </div>
                <div class="col-12 mt-3">
                    <input class="form-control" type="text" name="removerProduto" id="removerProduto">
                </div>
            </div>
            <div class="row mt-3 text-center">
                <div><button class="btn btn-danger col-12 mt-3" id="botaoRm"> Remover </button></div>
            </div>
            <div id="displayGeral">
                <hr>
                <h5 class="text-center mt-3 mb-3">Lista de produtos cadastrados</h5>
                <table class="table table-striped-columns" id="displayTabela">
                    <thead>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Quantidade</th>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div>
        <button class="btn btn-danger col-3 mt-3" id="botaoRm" onclick="location.href='paginateste.html'"> Botao teste proxima pagina </button>
        <a href="paginateste.html" class="btn btn-primary">sou um botao?</a>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
