<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="card mt-5 form-body">
            <div class="card-body">
                <h3 class="text-center">Formulário de envio</h3>
                <div class="row mt-4">
                    <div class="col-5">
                        <div class="form-group">
                            <label for="nome">Nome: </label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome">
                        </div>
                    </div>
                    <div class="col-5">
                        <div class="form-group">
                            <label for="idade">Idade: </label>
                            <input type="text" id="idade" name="idade" class="form-control" placeholder="Digite sua idade">
                        </div>
                    </div>
                    <div class="col-2 mt-2">
                        <button id="envio" type="button" class="btn btn-primary mt-3">Enviar</button>
                    </div>
                </div>
                <hr class="mt-4 mb-4" />
                <div class="row mb-3">
                    <div class="col-10">
                        <label for="nome2">Nome: </label>
                        <input type="text" id="nome2" name="nome2" class="form-control" placeholder="Digite o nome para verificar">
                    </div>
                    <div class="col-1 mt-4">
                        <button type="button" id="checar" class="btn btn-primary">Checar</button>
                    </div>
                    <div class="col-1 mt-4">
                        <button type="button" id="remover" class="btn btn-primary">Remover</button>
                    </div>
                </div>
                <hr class="mt-4 mb-4" />
                <div>
                    <h4 class="text-center">Lista de nomes</h4>
                    <div id="lista"></div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>    
</html>
