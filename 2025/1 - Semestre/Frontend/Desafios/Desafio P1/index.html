<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="card margem tabela">
        <div class="card-body">
            <h3 class="text-center">Listar produtos</h3>
            <form>
                <div class="row">
                    <div class="col-12 mt-3">
                        <label>Nome:</label>
                        <input class="form-control" type="text" name="nomeProduto" id="nomeProduto">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mt-3">
                        <label>Preço: </label>
                        <input class="form-control" type="text" name="precoProduto" id="precoProduto">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mt-3">
                        <label>Quantidade:</label>
                        <input class="form-control" type="text" name="quantProduto" id="quantProduto">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 mt-3 mb-3 text-center">
                        <button id="botaoEnviar" class="btn btn-success w-100">Adicionar produto</button>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-12 mt-3">
                        <label>Tipo de remoção: </label>
                        <div class="row mt-2">
                            <div class="col-6">
                                <label class="form-check-inline">
                                    <input type="radio" name="tipoRemocao" id="tipoRemocaoId" value="Id" checked>
                                    Remover por Id
                                </label>
                            </div>
                            <div class="col-6">
                                <label class="form-check-inline">
                                    <input type="radio" name="tipoRemocao" id="tipoRemocaoNome" value="Nome">
                                    Remover por Nome
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mt-3">
                        <label>Nome para remover:</label>
                        <input class="form-control" type="text" name="nomeProdutoRemover" id="nomeProdutoRemover">
                    </div>
                    <div class="col-6 mt-3">
                        <label>Id para remoção:</label>
                        <input class="form-control" type="text" name="idProdutoRemover" id="idProdutoRemover">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 mt-3 mb-3 text-center">
                        <button id="botaoRemover" class="btn btn-danger w-100">Remover produto</button>
                    </div>
                </div>
            </form>
            <h3 class="text-center mt-3">Lista cadastrada</h3>
            <div id="display">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Os dados dos produtos serão inseridos aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
