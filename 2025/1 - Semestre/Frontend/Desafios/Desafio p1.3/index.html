<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

<body>
    <div class="card m-4">
        <div class="card-body">
            <h4 class="text-center mt-3">Lista</h4>
            <form>
                <div class="row mt-3">
                    <div class="col">
                        <label>Nome:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="nomeProduto" id="nomeProduto">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <label>Valor:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="valorProduto" id="valorProduto">
                    </div>
                </div>
                <div class="mt-3 text-center">
                    <button class="btn btn-success" id="botaoAdd">adicionar</button>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <label>Nome editar:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="nomeProduto" id="nomeProduto1">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <label>Valor editar:</label>
                    </div>
                    <div class="col-12">
                        <input class="form-control" type="text" name="valorProduto" id="valorProduto1">
                    </div>
                </div>
                <div class="mt-3 text-center">
                    <button class="btn btn-success" id="botaoAdd2">Confirnar edição</button>
                </div>
            </form>
        </div>
    </div>
    <div class="card m-4">
        <div class="card-body">
            <h4 class="text-center"> Lista de produtos</h4>
            <div id="display">
                <table class="table table-striped">
                    <thead>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Excluir</th>
                        <th>Editar</th>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
