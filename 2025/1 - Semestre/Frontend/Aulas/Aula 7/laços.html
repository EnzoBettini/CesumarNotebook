<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let nomes = ["Lucas", "João", "Maria", "Ana", "Pedro"];

      console.log("📌 Usando for:");
      for (let i = 0; i < nomes.length; i++) {
        console.log(nomes[i]);
      }

      console.log("\n📌 Usando forEach:");
      nomes.forEach((nome, index) => {
        console.log(nome);
        console.log(index);
      });

      console.log("\n📌 Usando map (convertendo para maiúsculas):");
      let nomesMaiusculos = nomes.map((nome) => nome.toUpperCase());
      console.log(nomesMaiusculos);
    </script>
  </body>
</html>
